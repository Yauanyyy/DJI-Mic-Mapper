[package]
name = "dji-mic-mapper"
version = "0.1.1"
edition = "2024"
description = "Lightweight Windows 11 DJI Mic Mini button mapper"
license = "MIT"
build = "build.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
