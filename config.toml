# A single key or chord. Examples: F13, RightAlt, RightAlt+F13
target = "RightAlt"

# off: do not intercept Volume Up
# best_effort: correlate Volume Up with DJI Raw Input and replay unrelated input
# block_all: WARNING - block every Volume Up input from every device
volume_up_mode = "best_effort"

# off, error, warn, info, debug, or trace
log_level = "info"

# Used only by best_effort mode.
correlation_window_ms = 100

# Defaults observed from DJI Mic Mini receiver VID 0x2CA3 / PID 0x4011.
# These can be overridden for a different firmware revision.
usage_page = 0x000C
usage = 0x0001
button_usage = 0x00E9
report_id = 6
