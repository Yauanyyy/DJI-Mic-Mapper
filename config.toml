# DJI Mic Mapper

# Key triggered by the Mic button
target = "Ctrl+Shift+Home"

# Volume Up handling: off / best_effort / block_all
volume_up_mode = "best_effort"

# Logging: off / error / warn / info / debug / trace
log_level = "error"

# Correlation window for best_effort mode (ms)
correlation_window_ms = 50

# DJI Mic Mini HID settings
usage_page = 0x000C
usage = 0x0001
button_usage = 0x00E9
report_id = 6
